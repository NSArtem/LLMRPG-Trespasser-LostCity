schema: campaign-checkpoint/v1
checkpoint_id: cp-0002
base_checkpoint_id: cp-0001
kind: delta
created_at: "2026-07-29T18:40:37+04:00"
source_chat_ref: null

continuity:
  journal_entry_id: journal.entry-0002
  scene_id: scene-0007
  scene_status: continue
  next_scene_id: null
  next_scene_name: null

summary: "Группа отступила от пчёл, исследовала северо-западный путь из мастерской, обнаружила тайную комнату №3, уничтожила семь стирджей, укрылась от пяти пещерных саранчей и обыскала помещение."

assertions:
  - target: CURRENT.checkpoint_id
    equals: cp-0001
  - target: CURRENT.active_scene_id
    equals: scene-0007
  - target: CURRENT.active_journal_id
    equals: journal.entry-0002
  - target: party.location
    equals: location.pyramid.bee-treasury.threshold-safe-side
  - target: campaign.dungeon_frame
    equals:
      day: 1
      round: 5
      actions_used: 2
      actions_total: 3
  - target: clock.thirst
    equals:
      current: 6
      maximum: 6
  - target: clock.alarm
    equals:
      current: 5
      maximum: 10
  - target: character.nara.hp
    equals: 28
  - target: character.sevek.hp
    equals: 14
  - target: character.oris.hp
    equals: 16
  - target: character.tavra.hp
    equals: 20
  - target: character.nara.endurance
    equals: 12
  - target: character.sevek.endurance
    equals: 11
  - target: character.oris.endurance
    equals: 11
  - target: character.tavra.endurance
    equals: 10
  - target: party.light.active
    equals:
      item: crude-torch
      carrier: character.oris
      state: burning
  - target: location.pyramid.bee-treasury.workshop-door.state
    equals: ajar
  - target: location.pyramid.workshop.visible_exits
    equals:
      - door-east-to-bee-treasury
      - ladder-centre-to-gas-chamber
      - ladder-left-to-left-cylinder
      - ladder-right-to-right-cylinder

changes:
  - operation: move
    target: party.location
    from: location.pyramid.bee-treasury.threshold-safe-side
    to: location.pyramid.workshop
    reason: "Группа отказалась входить к пчёлам и отступила в ремонтную мастерскую."
    source_event: event-001

  - operation: set
    target: location.pyramid.bee-treasury.workshop-door.state
    from: ajar
    to: closed
    reason: "После отступления каменная дверь между мастерской и путём к сокровищнице закрылась."
    source_event: event-001

  - operation: set
    target: campaign.dungeon_frame
    from:
      day: 1
      round: 5
      actions_used: 2
      actions_total: 3
    to:
      day: 1
      round: 5
      actions_used: 3
      actions_total: 3
    reason: "Отступление от пчёл израсходовало последнее общее действие dungeon round 5."
    source_event: event-001

  - operation: set
    target: character.nara.hp
    from: 28
    to: 27
    reason: "Нара потеряла 1 HP от критической жажды в конце dungeon round 5."
    source_event: event-002

  - operation: set
    target: character.sevek.hp
    from: 14
    to: 13
    reason: "Севек потерял 1 HP от критической жажды в конце dungeon round 5."
    source_event: event-002

  - operation: set
    target: character.oris.hp
    from: 16
    to: 15
    reason: "Орис потерял 1 HP от критической жажды в конце dungeon round 5."
    source_event: event-002

  - operation: set
    target: character.tavra.hp
    from: 20
    to: 19
    reason: "Тавра потеряла 1 HP от критической жажды в конце dungeon round 5."
    source_event: event-002

  - operation: set
    target: clock.alarm.current
    from: 5
    to: 6
    reason: "Alarm увеличился на 1 в конце dungeon round 5."
    source_event: event-002

  - operation: set
    target: campaign.dungeon_frame
    from:
      day: 1
      round: 5
      actions_used: 3
      actions_total: 3
    to:
      day: 1
      round: 6
      actions_used: 0
      actions_total: 3
    reason: "Dungeon round 5 завершился без случайной встречи; начался dungeon round 6."
    source_event: event-002

  - operation: set
    target: location.pyramid.workshop.visible_exits
    from:
      - door-east-to-bee-treasury
      - ladder-centre-to-gas-chamber
      - ladder-left-to-left-cylinder
      - ladder-right-to-right-cylinder
    to:
      - door-east-to-bee-treasury
      - door-northwest-to-western-corridor
      - door-southwest-to-western-corridor
      - ladder-centre-to-gas-chamber
      - ladder-left-to-left-cylinder
      - ladder-right-to-right-cylinder
    reason: "Проверка карты модуля исправила неполное описание комнаты 6: в мастерской три дверных выхода, а не один."
    source_event: event-003

  - operation: add
    target: campaign.locations.discovered
    value: location.pyramid.northwest-corridor
    quantity: 1
    reason: "Группа исследовала путь через северо-западную дверь мастерской."
    source_event: event-004

  - operation: move
    target: party.location
    from: location.pyramid.workshop
    to: location.pyramid.northwest-corridor
    reason: "Группа прошла через северо-западную дверь мастерской."
    source_event: event-004

  - operation: set
    target: campaign.dungeon_frame
    from:
      day: 1
      round: 6
      actions_used: 0
      actions_total: 3
    to:
      day: 1
      round: 6
      actions_used: 1
      actions_total: 3
    reason: "Explore северо-западного коридора израсходовал первое действие dungeon round 6."
    source_event: event-004

  - operation: set
    target: location.pyramid.northwest-corridor.search_status
    from: unsearched
    to: searched
    reason: "Группа тщательно осмотрела коридор и прилегающие стены."
    source_event: event-005

  - operation: add
    target: campaign.features.discovered
    value: location.pyramid.northwest-corridor.secret-door-south
    quantity: 1
    reason: "Search обнаружил замаскированную каменную дверь в южной стене."
    source_event: event-005

  - operation: set
    target: campaign.dungeon_frame
    from:
      day: 1
      round: 6
      actions_used: 1
      actions_total: 3
    to:
      day: 1
      round: 6
      actions_used: 2
      actions_total: 3
    reason: "Search коридора израсходовал второе действие dungeon round 6."
    source_event: event-005

  - operation: set
    target: location.pyramid.secret-room-3.secret-door.state
    from: closed
    to: open
    reason: "Группа нашла подвижный участок и открыла тайную каменную плиту нажимом."
    source_event: event-006

  - operation: add
    target: campaign.locations.discovered
    value: location.pyramid.secret-room-3
    quantity: 1
    reason: "За тайной дверью обнаружена комната №3."
    source_event: event-006

  - operation: add
    target: encounters.active
    value: npc.stirges-room-3
    quantity: 7
    reason: "Открытие тайной двери потревожило семь стирджей."
    source_event: event-006

  - operation: set
    target: campaign.dungeon_frame
    from:
      day: 1
      round: 6
      actions_used: 2
      actions_total: 3
    to:
      day: 1
      round: 6
      actions_used: 3
      actions_total: 3
    reason: "Открытие и исследование пространства за тайной дверью израсходовало третье действие dungeon round 6."
    source_event: event-006

  - operation: remove
    target: encounters.active
    value: npc.stirges-room-3
    quantity: 7
    reason: "Все семь стирджей были уничтожены в абстрагированном бою."
    source_event: event-007

  - operation: add
    target: location.pyramid.secret-room-3.corpses
    value: stirge-corpse
    quantity: 7
    reason: "После боя в комнате остались тела семи стирджей."
    source_event: event-007

  - operation: set
    target: character.nara.hp
    from: 27
    to: 23
    reason: "Нара потеряла 4 HP в бою со стирджами."
    source_event: event-007

  - operation: set
    target: character.oris.hp
    from: 15
    to: 12
    reason: "Орис потерял 3 HP в бою со стирджами."
    source_event: event-007

  - operation: set
    target: character.tavra.hp
    from: 19
    to: 17
    reason: "Тавра потеряла 2 HP в бою со стирджами."
    source_event: event-007

  - operation: set
    target: clock.alarm.current
    from: 6
    to: 7
    reason: "Шум боя со стирджами увеличил Alarm на 1."
    source_event: event-007

  - operation: set
    target: character.nara.hp
    from: 23
    to: 22
    reason: "Нара потеряла ещё 1 HP от критической жажды в конце dungeon round 6."
    source_event: event-008

  - operation: set
    target: character.sevek.hp
    from: 13
    to: 12
    reason: "Севек потерял 1 HP от критической жажды в конце dungeon round 6."
    source_event: event-008

  - operation: set
    target: character.oris.hp
    from: 12
    to: 11
    reason: "Орис потерял ещё 1 HP от критической жажды в конце dungeon round 6."
    source_event: event-008

  - operation: set
    target: character.tavra.hp
    from: 17
    to: 16
    reason: "Тавра потеряла ещё 1 HP от критической жажды в конце dungeon round 6."
    source_event: event-008

  - operation: set
    target: clock.alarm.current
    from: 7
    to: 8
    reason: "Alarm увеличился на 1 в конце dungeon round 6."
    source_event: event-008

  - operation: set
    target: clock.alarm.current
    from: 8
    to: 0
    reason: "Alarm check вызвал случайную встречу, после чего часы Alarm сбросились."
    source_event: event-008

  - operation: add
    target: encounters.active
    value: npc.giant-cave-locusts
    quantity: 5
    reason: "Случайная встреча привела к тайной двери пять гигантских пещерных саранчей."
    source_event: event-008

  - operation: set
    target: campaign.dungeon_frame
    from:
      day: 1
      round: 6
      actions_used: 3
      actions_total: 3
    to:
      day: 1
      round: 7
      actions_used: 0
      actions_total: 3
    reason: "После завершения раунда и появления случайной встречи начался dungeon round 7."
    source_event: event-008

  - operation: move
    target: party.location
    from: location.pyramid.northwest-corridor
    to: location.pyramid.secret-room-3
    reason: "Группа отступила внутрь тайной комнаты, чтобы скрыться от саранчей."
    source_event: event-009

  - operation: set
    target: location.pyramid.secret-room-3.secret-door.state
    from: open
    to: closed
    reason: "Группа отпустила самозакрывающуюся каменную плиту и укрылась за ней."
    source_event: event-009

  - operation: remove
    target: encounters.active
    value: npc.giant-cave-locusts
    quantity: 5
    reason: "Саранчи не обнаружили тайную дверь и прошли мимо; встреча завершилась без боя."
    source_event: event-009

  - operation: move
    target: npc.giant-cave-locusts.location
    from: location.pyramid.northwest-corridor.near-secret-door
    to: location.pyramid.northwest-corridor.northward-unknown
    reason: "Пять саранчей удалились по коридору в северном направлении."
    source_event: event-009

  - operation: set
    target: location.pyramid.secret-room-3.search_status
    from: unsearched
    to: searched
    reason: "Группа полностью обыскала тайную комнату и тела стирджей."
    source_event: event-010

  - operation: move
    target: treasure.b4-room3-gems.location
    from: location.pyramid.secret-room-3
    to: party.inventory.unassigned
    reason: "Четыре драгоценных камня собраны вместе, но носитель и занимаемые слоты ещё не назначены."
    source_event: event-010

  - operation: set
    target: campaign.dungeon_frame
    from:
      day: 1
      round: 7
      actions_used: 0
      actions_total: 3
    to:
      day: 1
      round: 7
      actions_used: 1
      actions_total: 3
    reason: "Search тайной комнаты израсходовал первое действие dungeon round 7."
    source_event: event-010

journal_append:
  events:
    - id: event-001
      type: action
      fiction_time: "Первый день экспедиции, dungeon round 5, действие 3"
      summary: "Группа отступила от сокровищницы с четырьмя пчёлами в ремонтную мастерскую; дверь к пчёлам закрылась."

    - id: event-002
      type: action
      fiction_time: "Первый день экспедиции, конец dungeon round 5"
      summary: "Критическая жажда нанесла каждому 1 HP; Alarm вырос до 6, проверка d10=8 не вызвала встречу, факел Ориса продолжил гореть."

    - id: event-003
      type: discovery
      fiction_time: "Первый день экспедиции, начало dungeon round 6; исправление непрерывности"
      summary: "Карта B4 подтвердила, что мастерская №6 имеет три дверных выхода: восточный, северо-западный и юго-западный, помимо трёх лестниц."

    - id: event-004
      type: action
      fiction_time: "Первый день экспедиции, dungeon round 6, действие 1"
      summary: "Группа прошла через северо-западную дверь мастерской и исследовала коридор, идущий на запад и затем поворачивающий на север."

    - id: event-005
      type: discovery
      fiction_time: "Первый день экспедиции, dungeon round 6, действие 2"
      summary: "Search коридора обнаружил тайную каменную дверь в южной стене; ловушек на обследованном участке и двери не найдено."

    - id: event-006
      type: action
      fiction_time: "Первый день экспедиции, dungeon round 6, действие 3"
      summary: "Группа нажимом открыла тайную плиту и обнаружила комнату №3 с семью стирджами; групповая encounter check была выиграна."

    - id: event-007
      type: action
      fiction_time: "Первый день экспедиции, dungeon round 6, около двух combat rounds"
      summary: "Группа приняла абстрагированный бой в узком проёме и уничтожила семь стирджей; Нара потеряла 4 HP, Орис 3 HP, Тавра 2 HP, Севек не пострадал."

    - id: event-008
      type: action
      fiction_time: "Первый день экспедиции, конец dungeon round 6"
      summary: "Бой и завершение раунда подняли Alarm до 8; жажда нанесла каждому 1 HP, факел продолжил гореть, а alarm check вызвал пять пещерных саранчей и сбросил Alarm до 0."

    - id: event-009
      type: action
      fiction_time: "Первый день экспедиции, переход к dungeon round 7"
      summary: "Группа закрыла тайную дверь и укрылась в комнате №3; пять саранчей не нашли вход и ушли по коридору на север."

    - id: event-010
      type: action
      fiction_time: "Первый день экспедиции, dungeon round 7, действие 1"
      summary: "Search полностью обследовал комнату и тела стирджей: найдены и собраны четыре драгоценных камня, а высоко в северной стене обнаружено узкое отверстие."

  decisions:
    - source_event: event-001
      summary: "Отказаться от немедленного проникновения в сокровищницу пчёл и отступить."
    - source_event: event-004
      summary: "Исследовать северо-западный выход из мастерской."
    - source_event: event-007
      summary: "Принять бой со стирджами и разрешить его абстрагированно, используя узкий проём."
    - source_event: event-009
      summary: "Избежать боя с пещерными саранчами, закрыв тайную дверь и укрывшись в комнате."
    - source_event: event-010
      summary: "Обыскать тайную комнату и тела стирджей."

  consequences:
    - source_event: event-001
      summary: "Четыре пчелы остались живы за закрытой дверью; сокровищница не разграблена."
    - source_event: event-002
      summary: "Четыре уцелевших гоблина получили дополнительное время и ещё большую фору; их точное местоположение неизвестно."
    - source_event: event-007
      summary: "Все семь стирджей мертвы; Endurance, Recovery Dice, Resolve и состояния персонажей не изменились."
    - source_event: event-008
      summary: "После двух последовательных тиков жажды итоговые HP: Нара 22/28, Севек 12/15, Орис 11/17, Тавра 16/22."
    - source_event: event-009
      summary: "Случайная встреча завершилась без боя и без дополнительного dungeon action."
    - source_event: event-010
      summary: "Комната №3 полностью обыскана; иных проходов, ловушек, сокровищ или полезных ресурсов на телах стирджей не обнаружено."

  important_rolls:
    - id: roll-001
      source_event: event-002
      procedure: alarm-check
      die: d10
      die_result: 8
      target: 6
      outcome: "Встреча не произошла."

    - id: roll-002
      source_event: event-006
      procedure: "group AGILITY | STEALTH encounter check"
      target: 12
      results:
        - subject: character.nara
          die_result: 14
          modifiers: 1
          total: 15
          outcome: success
        - subject: character.sevek
          die_result: 13
          modifiers: 4
          total: 17
          outcome: success
        - subject: character.oris
          die_result: 13
          modifiers: -4
          modifier_note: "Горящий факел; AGILITY 0."
          total: 9
          outcome: failure
        - subject: character.tavra
          die_result: 7
          modifiers: 3
          total: 10
          outcome: failure
      group_successes: 2
      group_failures: 2
      outcome: "Применённый в чате результат: группа выиграла encounter check и получила выбор подхода; противник не был застигнут врасплох."

    - id: roll-003
      source_event: event-008
      procedure: alarm-check
      die: d10
      die_result: null
      target: 8
      outcome: "Результат был не выше 8; произошла встреча с пятью гигантскими пещерными саранчами, после чего Alarm сбросился."

new_facts:
  - id: fact.workshop-three-door-layout
    kind: established
    content: "Ремонтная мастерская №6 имеет восточную дверь к пути в сокровищницу, северо-западную и юго-западную двери в западные коридоры, а также три лестницы к статуям."
    truth_status: confirmed
    knowledge_level: player-known
    source_event: event-003

  - id: fact.northwest-corridor-secret-door
    kind: established
    content: "В коридоре за северо-западной дверью мастерской есть тайная дверь в южной стене; обследованный участок и сама дверь не имеют обнаруженных ловушек."
    truth_status: confirmed
    knowledge_level: player-known
    source_event: event-005

  - id: fact.room3-secret-door-mechanism
    kind: established
    content: "Тайная дверь комнаты №3 является тяжёлой каменной плитой, открывается нажимом и медленно закрывается, если её не удерживать."
    truth_status: confirmed
    knowledge_level: player-known
    source_event: event-006

  - id: fact.room3-stirges-slain
    kind: established
    content: "В комнате №3 обитали семь стирджей; все они уничтожены, их тела остаются внутри."
    truth_status: confirmed
    knowledge_level: player-known
    source_event: event-007

  - id: fact.cave-locusts-passed-north
    kind: established
    content: "Пять гигантских пещерных саранчей прошли мимо закрытой тайной двери и удалились по коридору в северном направлении."
    truth_status: confirmed
    knowledge_level: player-known
    source_event: event-009

  - id: fact.room3-four-gems
    kind: established
    content: "В комнате №3 найдены четыре драгоценных камня с указанной в B4 стоимостью 100 gp, 100 gp, 500 gp и 1000 gp; камни собраны вместе, но ещё не получили Trespasser Value."
    truth_status: confirmed
    knowledge_level: player-known
    source_event: event-010

  - id: fact.room3-north-aperture
    kind: established
    content: "Высоко в северной стене комнаты №3 имеется небольшое отверстие, слишком узкое для персонажей; стирджи использовали его для вылета наружу."
    truth_status: confirmed
    knowledge_level: player-known
    source_event: event-010

  - id: fact.room3-search-complete
    kind: established
    content: "Комната №3 полностью обыскана: других проходов, ловушек и сокровищ не обнаружено; тела стирджей не содержат назначенных модулем ресурсов или добычи."
    truth_status: confirmed
    knowledge_level: player-known
    source_event: event-010

knowledge_changes:
