- operation: add
  target: campaign.locations
  value: location.lair.storage-room
  reason: За аркой установлено сухое складское помещение с кладовой и проходами.
  source_event: event-025
- operation: add
  target: campaign.locations
  value: location.lair.lower-corridor
  reason: За заклиненной дверью установлен спускающийся коридор, развилка, лестница и шахта люка.
  source_event: event-030
- operation: add
  target: campaign.locations
  value: location.lair.upper-ruin
  reason: Над люком установлено сырое полуразрушенное помещение с холодным проломом.
