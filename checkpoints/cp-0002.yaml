new_rulings:
- id: ruling.dehydration-trespasser
  summary: 'Обезвоживание адаптировано как особая plight: персонаж не добавляет положительные бонусы к checks и attacks; отрицательные
    модификаторы и shadows действуют; plight снимается достаточным количеством безопасной воды и не снимается обычным эмоциональным
    recovery; без воды смерть наступает через 24 часа. Из-за утраченного прежнего времени строгий предел при первом применении
    начат с 48 dungeon rounds, без ретроактивного пересчёта.'
  status: active prospectively; party currently not dehydrated
  source_event: event-017
- id: ruling.player-rolls
  summary: Кубы за персонажей игрока бросает пользователь. Ведущий заранее объявляет характеристику, TN, shadows и очевидные
    ставки и ждёт результат перед описанием исхода.
  status: active
  source_event: event-034
- id: ruling.group-check-assistance
  summary: Когда помощь оформлена групповой проверкой, каждый участвующий персонаж бросает отдельно; успех определяется по
    доле успешных участников. Обычный полный успех без объявленной shadow не создаёт и не запасает искру.
  status: active clarification
  source_event: event-034
