schema: campaign-checkpoint/v1
checkpoint_id: cp-0002
base_checkpoint_id: cp-0001
kind: delta
created_at: '2026-07-30T01:45:41+04:00'
source_chat_ref: current-project-chat-after-cp-0001
continuity:
  journal_entry_id: journal.entry-0001
  scene_id: scene-0005
  scene_status: continue
  next_scene_id: null
  next_scene_name: null
summary: Группа открыла окованную дверь, нашла воду и переносной свет, исследовала импровизированную ветвь, собрала припасы,
  ушла от бледного ползуна и забаррикадировала люк в верхней руине.
assertions:
- target: CURRENT.checkpoint_id
  equals: cp-0001
- target: CURRENT.active_scene_id
  equals: scene-0004
- target: CURRENT.active_journal_id
  equals: journal.entry-0001
- target: journal.entry-0001.status
  equals: open
- target: party.location
  equals: location.lair.ironbound-door
- target: clock.lair-alarm
  equals: 1/10
- target: clock.dungeon-round.phase
  equals: unknown
- target: character.bjorn.hp
  equals: 8/8
- target: character.elsa.hp
  equals: 6/6
- target: character.godwin.hp
  equals: 5/5
- target: character.godwin.inventory
  contains: opened brass tube
- target: party.inventory.wet-clothing-bundles
  equals: 3 intact bundles
- target: location.lair.ironbound-door.state
  equals: closed; lock status unknown
changes:
- operation: set
  target: clock.dungeon-round.phase
  from: unknown
  to: 0/3
  reason: Установлена новая граница, затем завершены три точно отслеженных раунда; после встречи начался новый раунд без израсходованных
    dungeon actions.
  source_event: event-028
- operation: add
  target: clock.dungeon-round.completed_since_normalization
  value: 3
  quantity: 3
  reason: После нормализации полностью завершены три dungeon rounds.
  source_event: event-028
- operation: set
  target: clock.lair-alarm
  from: 1/10
