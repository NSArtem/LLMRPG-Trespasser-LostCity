- Точное абсолютное время первого дня неизвестно. После нормализации подтверждены три полных dungeon rounds (около 90 минут)
  плюс несколько минут погони и баррикадирования; прежнее время не восстановлено.
- Импортированный номер dungeon round неизвестен; текущая рабочая фаза после встречи установлена как 0/3.
- Полная длительность грибного светильника неизвестна; подтверждено, что он не ослаб как минимум за десять минут и прошёл
  одну depletion check.
- Точное количество масла, оставшееся в кувшине после заправки лампы, не измерено.
