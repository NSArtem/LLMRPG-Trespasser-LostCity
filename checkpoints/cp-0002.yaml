  и три кувшина.
- Личность, происхождение, stat block и связь бледного ползуна с Агнцем или существами модуля не установлены.
- Неизвестно, как долго люк и каменная баррикада выдержат и продолжает ли существо немедленно ломиться снизу.
- Вся ветвь за окованной дверью остаётся несопоставленной с номерными комнатами исходного модуля.
- Содержимое нескольких закупоренных кувшинов, оставшихся в основном складском помещении, не проверено.
- Источник животного мускуса и шорканья в правом проходе за подъёмной плитой не установлен.
- Не подтверждено, ведёт ли холодный пролом верхней руины непосредственно наружу или в другую открытую область.
- Деревянный клин не возвращён; его точное состояние после разрушения двери неизвестно.
