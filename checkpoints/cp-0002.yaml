- operation: set
  target: location.lair.luminous-cistern-room.right-stone-slab
  from: closed
  to: open; held at chest height by wall catch
  reason: Тяга цепи подняла плиту и выдвинула фиксатор.
  source_event: event-020
- operation: add
  target: location.lair.luminous-cistern-room.resources
  value: continuously dripping clear water, potable for current use
  reason: Проба и последующее питьё не дали быстрых вредных симптомов; группа утолила жажду.
  source_event: event-019
- operation: add
  target: character.bjorn.plights
  value: dehydrated
  reason: Применена адаптация стартового обезвоживания модуля.
  source_event: event-017
- operation: add
  target: character.elsa.plights
  value: dehydrated
  reason: Применена адаптация стартового обезвоживания модуля.
  source_event: event-017
- operation: add
  target: character.godwin.plights
  value: dehydrated
  reason: Применена адаптация стартового обезвоживания модуля.
  source_event: event-017
- operation: add
  target: clock.dehydration-death
  value: 48 dungeon rounds from application
  quantity: 48
  reason: Неизвестное прежнее время не пересчитывалось; строгий предел начат только с текущего момента.
  source_event: event-017
- operation: remove
  target: character.bjorn.plights
  value: dehydrated
  reason: Бьорн выпил достаточно пригодной воды.
  source_event: event-019
- operation: remove
  target: character.elsa.plights
  value: dehydrated
  reason: Эльза выпила достаточно пригодной воды.
  source_event: event-019
- operation: remove
  target: character.godwin.plights
  value: dehydrated
  reason: Годвин выпил достаточно пригодной воды.
  source_event: event-019
- operation: remove
  target: clock.dehydration-death
  value: 48 dungeon rounds from application
  quantity: 48
  reason: После достаточного питья угроза смерти от текущего обезвоживания прекращена.
  source_event: event-019
- operation: remove
  target: character.godwin.inventory
  value: opened brass tube
  quantity: 1
  reason: Латунный тубус использован как корпус грибного светильника.
  source_event: event-023
- operation: add
  target: party.inventory
  value: 'fungus lamp: weak directed gray-green light, damp cloth retainer and hand loop; currently working'
  quantity: 1
  reason: Группа изготовила переносной источник света.
  source_event: event-023
- operation: set
  target: party.inventory.wet-clothing-bundles
  from: 3 intact bundles
  to: 3 bundles; one bundle partly cut for damp cloth strips
  reason: Часть ткани использована при изготовлении грибного светильника.
  source_event: event-023
- operation: add
  target: party.inventory
  value: tarred cord, 20 feet
  quantity: 1
  reason: Найдено в развалившейся корзине в пещере.
  source_event: event-024
- operation: add
  target: party.inventory
  value: iron S-hooks
  quantity: 2
  reason: Найдены в развалившейся корзине в пещере.
  source_event: event-024
- operation: add
  target: party.inventory
  value: wide wooden wedge
  quantity: 1
  reason: Найден в развалившейся корзине в пещере.
  source_event: event-024
- operation: remove
  target: party.inventory
  value: wide wooden wedge
  quantity: 1
  reason: Клин оставлен под дверью во время отступления и не был возвращён после того, как существо сломало преграду.
  source_event: event-031
- operation: add
  target: party.inventory
  value: copper oil lamp, fitted with new wick, filled with some oil, unlit
  quantity: 1
  reason: Лампа найдена и подготовлена в кладовой.
  source_event: event-027
- operation: add
  target: party.inventory
  value: clay jug with remaining lamp oil; less than the amount found before filling the lamp
  quantity: 1
  reason: Масло забрано из кладовой, часть перелита в лампу.
  source_event: event-027
- operation: add
  target: party.inventory
  value: clay jug of wine vinegar
  quantity: 1
  reason: Забран из кладовой.
  source_event: event-027
- operation: add
  target: party.inventory
  value: empty intact clay jug
  quantity: 1
  reason: Забран из кладовой; водой не наполнен.
  source_event: event-027
- operation: add
  target: party.inventory
  value: usable plant fibre for several additional wicks
  quantity: 1
  reason: Сохранённая часть волокна забрана из кладовой.
  source_event: event-027
- operation: add
  target: party.inventory
  value: flint and steel
  quantity: 1
  reason: Найдены в треснувшем ящике в кладовой.
  source_event: event-026
- operation: add
  target: party.inventory
  value: short wax candles
  quantity: 3
  reason: Найдены в треснувшем ящике в кладовой.
  source_event: event-026
- operation: add
  target: campaign.npcs
  value: npc.bloated-crawler
  reason: Случайная встреча ввела огромное бледное раздутое ползущее существо.
  source_event: event-028
- operation: move
  target: npc.bloated-crawler.location
  from: location.lair.storage-room
  to: location.lair.lower-corridor
  reason: Существо сломало подперетую дверь и преследовало группу по коридору.
  source_event: event-031
- operation: move
  target: npc.bloated-crawler.location
  from: location.lair.lower-corridor
  to: location.lair.lower-corridor.hatch-shaft
  reason: Существо достигло железной лестницы под люком, но было остановлено баррикадой.
  source_event: event-033
- operation: set
  target: location.lair.lower-corridor.jammed-door
  from: closed and jammed at the threshold
  to: broken or breached; wooden wedge left behind and unrecovered
  reason: Бьорн открыл дверь киркой, затем группа закрыла и подперла её; существо сломало преграду.
  source_event: event-031
- operation: set
  target: location.lair.upper-ruin.hatch
  from: open and unsecured from above
  to: closed and pinned by a heavy flat stone
  reason: Бьорн и Эльза совместно забаррикадировали люк.
  source_event: event-033
journal_append:
  events:
  - id: event-013
    type: action
    fiction_time: Вне fiction, перед продолжением после cp-0001
    summary: 'Из-за неизвестной импортированной фазы установлена новая граница dungeon round: 0/3 при Alarm 1/10; прежний
      номер раунда не восстанавливался.'
  - id: event-014
    type: discovery
    fiction_time: Первый день; первый отслеженный dungeon round, действие 1/3
    summary: 'Группа осторожно обследовала окованную дверь: ловушка не обнаружена, замок механический, длинный ключ Эльзы
      подходил по форме; за дверью слышались вода и редкий звон цепи.'
  - id: event-015
    type: action
    fiction_time: Первый день; первый отслеженный dungeon round, после действия 1/3
    summary: Эльза открыла замок длинным железным ключом, а Бьорн распахнул дверь; за ней оказалась пустая освещённая грибком
      камера с каменной чашей.
  - id: event-016
    type: discovery
    fiction_time: Первый день; первый отслеженный dungeon round, действие 2/3
    summary: Поиск камеры выявил чистую капающую воду, светящийся грибок, подвесную цепь с механизмом, левый спуск и правую
      каменную плиту с настенным фиксатором.
  - id: event-017
    type: action
    fiction_time: Первый день; первый отслеженный dungeon round, после действия 2/3
    summary: По просьбе игрока модульное обезвоживание было адаптировано как особая plight и применено ко всем троим с новым
      строгим пределом 48 dungeon rounds.
  - id: event-018
    type: action
    fiction_time: Первый день; первый отслеженный dungeon round, действие 3/3
    summary: Эльза выпила пробную горсть воды; за десять минут быстрых симптомов не возникло. Раунд завершился, Alarm вырос
      с 1 до 2 без встречи, а счётчик обезвоживания достиг 1/48.
  - id: event-019
    type: action
    fiction_time: Первый день; второй отслеженный dungeon round, действие 1/3
    summary: Бьорн, Эльза и Годвин достаточно напились из чаши; plight обезвоживания снята, строгий счётчик остановлен, воду
      сочли пригодной для текущего употребления.
  - id: event-020
    type: action
    fiction_time: Первый день; второй отслеженный dungeon round, после действия 1/3
    summary: 'Годвин потянул цепь: правая каменная плита поднялась и осталась на фиксаторе. Громкий скрежет повысил Alarm
      с 2 до 3.'
  - id: event-021
    type: discovery
    fiction_time: Первый день; второй отслеженный dungeon round, после действия 1/3
    summary: 'Группа ненадолго разведала правый проход: за поворотом была полная темнота, запах старого дерева и животный
      мускус, вдали слышалось нерегулярное шорканье.'
  - id: event-022
    type: discovery
    fiction_time: Первый день; второй отслеженный dungeon round, после действия 1/3
    summary: Левый спуск привёл в низкую пещеру с мелким ручьём, трёхдосочным настилом к арке и крупным неподвижным свёртком
      в нише.
  - id: event-023
    type: action
    fiction_time: Первый день; второй отслеженный dungeon round, действие 2/3
    summary: Из вскрытого латунного тубуса, влажной полосы ткани и светящегося грибка группа изготовила слабый направленный
      грибной светильник; за десять минут свет не ослаб.
  - id: event-024
    type: discovery
    fiction_time: Первый день; второй отслеженный dungeon round, действие 3/3
    summary: 'Полный поиск пещеры выявил подгнившую среднюю доску настила, слишком узкий для человека сток ручья, безопасную
      на вид арку, старые борозды от волочения корзины и в развалившейся корзине 20 футов просмоленного шнура, два железных
      крюка и деревянный клин. Раунд завершился: Alarm 3→4, встреча не произошла, светильник не истощился.'
  - id: event-025
    type: action
    fiction_time: Первый день; третий отслеженный dungeon round, до действия 1/3
    summary: Группа забрала полезные находки, безопасно пересекла настил и через арку вошла в сухое помещение со сгнившими
      стеллажами, завалом, непроверенными кувшинами, правой кладовой и узким проходом слева.
  - id: event-026
    type: discovery
    fiction_time: Первый день; третий отслеженный dungeon round, действие 1/3
    summary: В незапертой кладовой найдены ламповое масло, винный уксус, пустой целый кувшин, медная лампа, волокно для фитилей,
      огниво с кремнем и три свечи; скрытых выходов не обнаружено.
  - id: event-027
    type: action
    fiction_time: Первый день; третий отслеженный dungeon round, действие 2/3
    summary: Группа забрала припасы и подготовила медную масляную лампу с новым фитилём и небольшим количеством масла, но
      не зажигала её.
  - id: event-028
    type: discovery
    fiction_time: Первый день; третий отслеженный dungeon round, действие 3/3
    summary: В узком проходе за стеллажами группа дошла до заклиненной двери; на проверке Alarm 4→5 выпала встреча, после
      чего Alarm сбросился до 0. Позади появился огромный бледный раздутый ползун, принюхивавшийся к группе.
  - id: event-029
    type: action
    fiction_time: Первый день; немедленная угроза после третьего отслеженного раунда
    summary: Бьорн попытался тихо открыть заклиненную дверь; игрок выбросил 4, итог 7 с Might 3 против TN 14 при одной shadow.
      Дверь не открылась, шум выдал группу существу.
  - id: event-030
    type: action
    fiction_time: Первый день; немедленная угроза
    summary: Бьорн использовал кирку как рычаг и по броску игрока 19 успешно сорвал дверь с заклинившего порога против TN
      12.
  - id: event-031
    type: action
    fiction_time: Первый день; погоня, несколько минут
    summary: Группа прошла через дверь, закрыла её и подперла деревянным клином, затем быстро ушла по коридору и выбрала левую
      лестницу на развилке; существо сломало преграду и продолжило преследование.
  - id: event-032
    type: action
    fiction_time: Первый день; погоня, несколько минут
    summary: Все трое поднялись по железной лестнице через незапертый люк в сырое полуразрушенное каменное помещение с проломом,
      откуда тянуло холодным воздухом.
  - id: event-033
    type: action
    fiction_time: Первый день; завершение погони
    summary: 'Группа закрыла люк и совместно уложила сверху тяжёлый каменный обломок: Бьорн 7+3=10, Эльза 17+1=18 против TN
      10. Люк удержался; существо осталось в шахте. Искра не возникла.'
  - id: event-034
    type: discovery
    fiction_time: Вне fiction, после завершения погони
    summary: 'Процедура уточнена: игрок сам бросает кубы за своих персонажей; ведущий заранее объявляет характеристику, TN,
      shadows и очевидные ставки. Помощь в этой ситуации разрешена групповой проверкой, а обычный полный успех без shadow
      не создаёт запасаемую искру.'
  decisions:
  - Начать точный учёт dungeon rounds с новой границы, не восстанавливая неизвестную импортированную фазу.
  - Открыть окованную дверь длинным ключом Эльзы и обследовать ветвь за ней.
  - Применить адаптированное обезвоживание, испытать воду и затем напиться всем троим.
  - Изготовить грибной светильник, забрать найденные инструменты и припасы и подготовить незажжённую масляную лампу.
  - При появлении бледного ползуна продвигаться вперёд, силой открыть заклиненную дверь, выбрать левую лестницу и уйти через
    люк.
  - Закрыть люк и совместно прижать его тяжёлым камнем.
  - Игрок бросает кубы за своих персонажей; помощь в баррикадировании была разрешена групповой проверкой.
  consequences:
  - Окованная дверь и правая каменная плита остались открыты.
  - Найден источник пригодной для текущего питья воды; обезвоживание снято, но переносимого запаса воды нет.
  - У группы появились грибной светильник, подготовленная масляная лампа, огонь, свечи, шнур, крюки и три кувшина.
  - Деревянный клин утрачен при отступлении; дверь в нижний коридор сломана или проломлена существом.
