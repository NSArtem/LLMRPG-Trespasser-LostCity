schema: campaign-checkpoint/v1
checkpoint_id: cp-0001
base_checkpoint_id: null
kind: baseline
created_at: 2026-07-29
source_chat_ref: lairofthelamb.pdf

continuity:
  journal_entry_id: journal.entry-0001
  scene_id: scene-0004
  scene_status: continue
  next_scene_id: null
  next_scene_name: null

summary: "Baseline-импорт сыгранной кампании Lair of the Lamb до окованной двери со светом."

assertions:
  - "До импорта репозиторий находился в состоянии preparation без checkpoint."
  - "Источник кампании содержит одну непрерывную сыгранную последовательность."

changes:
  - operation: add
    target: campaign
    value: "Lair of the Lamb на Trespasser v2.1.3"
    reason: "Импорт кампании из PDF чата."
    source_event: event-001
  - operation: add
    target: party
    value: "Бьорн, Эльза, Годвин и Марта"
    reason: "Создание baseline состава."
    source_event: event-001
  - operation: set
    target: character.marta.status
    from: active
    to: dead
    reason: "Марта утонула в ледяной цистерне."
    source_event: event-007
  - operation: set
    target: npc.unknown-hunter.status
    from: active
    to: dead
    reason: "Группа убила существо в сухом коридоре."
    source_event: event-011
  - operation: move
    target: party.location
    from: location.lair.start-cell
    to: location.lair.ironbound-door
    reason: "Итог пройденного маршрута."
    source_event: event-012

journal_append:
  events:
    - id: event-001
      type: discovery
      fiction_time: "Первый день, начало"
      summary: "Бьорн, Эльза, Годвин и Марта очнулись в тёмной стартовой камере под Белым храмом."
    - id: event-002
      type: action
      fiction_time: "Первый день, позднее"
      summary: "Неудачная попытка выломать дверь подняла alarm с 0 до 1; крупное существо пришло на шум и выломало дверь снаружи."
    - id: event-003
      type: action
      fiction_time: "Первый день, позднее"
      summary: "Группа тихо спустилась в сточную яму с помощью кирки и избежала обнаружения."
    - id: event-004
      type: discovery
      fiction_time: "Первый день, позднее"
      summary: "В стоке с утопленника сняты ржавый тесак и запечатанный латунный тубус."
    - id: event-005
      type: discovery
      fiction_time: "Первый день, позднее"
      summary: "Сточный желоб закончился водопадом в большой затопленный зал."
    - id: event-006
      type: action
      fiction_time: "Первый день, позднее"
      summary: "Группа спустилась в цистерну и поплыла в направлении сквозняка."
    - id: event-007
      type: action
      fiction_time: "Первый день, позднее"
      summary: "После провала заплыва трое достигли уступа, а Марта и щенок утонули."
    - id: event-008
      type: action
      fiction_time: "Первый день, позднее"
      summary: "Выжившие прошли расщелину и сняли мокрую одежду, связав её в тюки."
    - id: event-009
      type: discovery
      fiction_time: "Первый день, позднее"
      summary: "Годвин вскрыл тубус и нашёл похожий на карту пергамент и обломок мела."
    - id: event-010
      type: action
      fiction_time: "Первый день, позднее"
      summary: "Группа спряталась у стен и устроила засаду неизвестному существу."
    - id: event-011
      type: action
      fiction_time: "Первый день, позднее"
      summary: "Бьорн, Эльза и Годвин совместно убили неизвестного охотника."
    - id: event-012
      type: discovery
      fiction_time: "Первый день, текущий момент"
      summary: "Группа обнаружила окованную дверь со слабым серо-зелёным светом из щели снизу."
  decisions:
    - "Скрыться от крупного существа через сточную яму."
    - "Плыть по направлению сквозняка."
    - "Сохранить смерть Марты как цену провала."
    - "Снять мокрую одежду и нести её тюками."
    - "Убить неизвестного охотника из засады."
  consequences:
    - "Марта и щенок погибли."
    - "Unknown hunter убит; группа покрыта его кровью."
    - "Стартовая дверь разрушена."
    - "Alarm импортирован как 1/10 с отмеченным конфликтом."
  important_rolls:
    - "Попытка выбить дверь: заявленный итог 8, failure."
    - "Тихий спуск в сток: 7 на кубе +3 = 10, success."
    - "Заплыв: 6 на кубе +3 = 9 против TN 10, failure."

new_facts:
  - id: fact.party-captured
    kind: established
    content: "Четыре commoners очнулись пленниками под Белым храмом."
    truth_status: confirmed
    knowledge_level: player-known
    source_event: event-001
  - id: fact.marta-dead
    kind: established
    content: "Марта и щенок погибли в затопленной цистерне."
    truth_status: confirmed
    knowledge_level: player-known
    source_event: event-007
  - id: fact.start-cell-breached
    kind: established
    content: "Крупное существо выломало дверь стартовой камеры снаружи."
    truth_status: confirmed
    knowledge_level: player-known
    source_event: event-002
  - id: fact.corpse-loot
    kind: established
    content: "В стоке с утопленника сняты ржавый тесак и тубус."
    truth_status: confirmed
    knowledge_level: player-known
    source_event: event-004
  - id: fact.tube-contents
    kind: established
    content: "В тубусе находились похожий на карту пергамент и мел."
    truth_status: confirmed
    knowledge_level: player-known
    source_event: event-009
  - id: fact.hunter-dead
    kind: established
    content: "Неизвестный охотник убит в сухом коридоре."
    truth_status: confirmed
    knowledge_level: player-known
    source_event: event-011
  - id: fact.light-beyond-door
    kind: established
    content: "За текущей окованной дверью есть слабый серо-зелёный свет."
    truth_status: confirmed
    knowledge_level: player-known
    source_event: event-012
  - id: fact.lamb-alive
    kind: established
    content: "Смерть Агнца не происходила; исходное состояние модуля сохраняет его живым."
    truth_status: confirmed
    knowledge_level: gm-secret
    source_event: event-002

knowledge_changes:
  - operation: add
    subject: party
    knowledge_ref: fact.marta-dead
    summary: "Трое выживших знают, что Марта и щенок не выбрались из воды."
    source_event: event-007
  - operation: add
    subject: party
    knowledge_ref: fact.light-beyond-door
    summary: "Группа увидела свет из-под окованной двери."
    source_event: event-012

new_rulings:
  - ruling.first-day-hp
  - ruling.start-dehydration
  - ruling.spark-shadow-roll
  - ruling.darkness
  - ruling.mob-damage
  - ruling.dungeon-time-alarm
