open_thread_changes:
  - operation: add
    thread_id: thread.escape-lair
    title: "Побег из логова"
    question: "Как выжившие выберутся из подземелий Белого храма?"
    status: active
    knowledge_level: player-known
    source_event: event-001
  - operation: add
    thread_id: thread.ironbound-door
    title: "Свет за дверью"
    question: "Подходит ли ключ и что находится по ту сторону?"
    status: active
    knowledge_level: player-known
    source_event: event-012
  - operation: add
    thread_id: thread.parchment-map
    title: "Пергамент из тубуса"
    question: "Является ли он картой и что на нём написано?"
    status: active
    knowledge_level: player-known
    source_event: event-009
  - operation: add
    thread_id: thread.unknown-hunter
    title: "Неизвестный охотник"
    question: "Что за существо было убито в сухом коридоре?"
    status: active
    knowledge_level: player-known
    source_event: event-011
  - operation: add
    thread_id: thread.find-light-water
    title: "Свет и вода"
    question: "Где добыть надёжный свет и питьевую воду?"
    status: active
    knowledge_level: player-known
    source_event: event-012
  - operation: add
    thread_id: thread.module-reconnection
    title: "Возврат к карте модуля"
    question: "К какой номерной комнате ведёт импровизированная ветвь?"
    status: active
    knowledge_level: gm-secret
    source_event: event-012

uncertainties:
  - "Точная длительность и фаза dungeon round не восстановимы из чата."
  - "Alarm явно назван равным 1, но последующие повышения не отслеживались по рулбуку."
  - "Импровизированные помещения не сопоставлены с номерными комнатами модуля."
  - "Природа и stat block неизвестного охотника не установлены."
  - "Содержимое пергамента и комнаты за дверью не установлено."

